# Project
license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedStorage/issues
family_name=Assorted Storage
# Shared by every mod here. The creative tab, manual section and advancement tab use these.
family_id=assortedstorage
family_icons=assortedcontainers:wood_cabinet,assortedcrates:oak_crate,assortedbarrels:barrel_gold,assortedbags:bag,assortedchests:chest_gold,assortedshulkers:shulker_box_gold,assortedhoppers:hopper_gold,assortedlocks:locksmith_lock,assortedlevelupgrades:level_upgrade_gold
family_manual_order=80
# The bundle's first version after the split. Every part refuses to load next to the old mod from before it.
family_split_version=12.0.0
# Every mod in this repo. Each one is a folder under mods.
assorted_mods=storage,chests,barrels,shulkers,hoppers,crates,bags,containers,locks,levelupgrades
# Build
# The AssortedBuild version these mods use. It sets the Minecraft, NeoForge and Fabric versions.
assortedbuild_version=26.2.6
# Mod Options
mod_author=Grim3212
# The lowest Assorted Lib version these mods work with.
assortedlib_version=4.3.0
# Build options. Leaving one out turns it off. A mod can turn one on in its own gradle.properties.
jei_enabled=false
client_gametests_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel. Can be release, beta or alpha.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
